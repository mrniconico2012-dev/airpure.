<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirPure</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #063b25, #0b6b43, #13a35f);
      color: white;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .app {
      width: 100%;
      max-width: 500px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .header p {
      opacity: 0.8;
      font-size: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .circle {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      margin: 10px auto 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: conic-gradient(#54ff9b 0deg, #54ff9b 0deg, rgba(255,255,255,0.15) 0deg);
      position: relative;
      transition: background 0.3s;
    }

    .circle::before {
      content: "";
      position: absolute;
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: #095b39;
    }

    .percentage {
      position: relative;
      z-index: 2;
      font-size: 48px;
      font-weight: bold;
    }

    .percentage-label {
      position: relative;
      z-index: 2;
      opacity: 0.8;
    }

    .status {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .substatus {
      text-align: center;
      opacity: 0.75;
      min-height: 22px;
    }

    .data {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .data-box {
      background: rgba(0,0,0,0.15);
      padding: 16px;
      border-radius: 16px;
      text-align: center;
    }

    .data-box .icon {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .data-box h3 {
      font-size: 13px;
      opacity: 0.7;
      font-weight: normal;
    }

    .data-box p {
      font-size: 19px;
      font-weight: bold;
      margin-top: 4px;
    }

    .filter-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .bar {
      height: 13px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #54ff9b;
      border-radius: 20px;
      transition: width 0.4s;
    }

    .leaves {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .leaf {
      position: absolute;
      font-size: 22px;
      opacity: 0.2;
      animation: fall linear infinite;
    }

    @keyframes fall {
      from {
        transform: translateY(-100px) rotate(0deg);
      }

      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .complete {
      display: none;
      text-align: center;
      padding: 18px;
      border-radius: 18px;
      background: rgba(84,255,155,0.15);
      border: 1px solid rgba(84,255,155,0.3);
      color: #aaffc9;
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      margin-top: 20px;
      background: #54ff9b;
      color: #06472c;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.02);
      background: #7dffb4;
    }

    .button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="leaves" id="leaves"></div>

  <main class="app">

    <header class="header">
      <h1>🍃 AirPure</h1>
      <p>Sistema inteligente de purificación de aire</p>
    </header>

    <section class="card">

      <div class="circle" id="circle">
        <span class="percentage" id="percentage">0%</span>
        <span class="percentage-label">Purificación</span>
      </div>

      <div class="status" id="status">
        Detectando partículas...
      </div>

      <div class="substatus" id="substatus">
        Analizando la calidad del aire
      </div>

      <div class="data">

        <div class="data-box">
          <div class="icon">🌿</div>
          <h3>Calidad del aire</h3>
          <p id="quality">Buena</p>
        </div>

        <div class="data-box">
          <div class="icon">💨</div>
          <h3>Estado</h3>
          <p id="airStatus">Activo</p>
        </div>

        <div class="data-box">
          <div class="icon">🧹</div>
          <h3>Filtración</h3>
          <p id="filtration">0%</p>
        </div>

        <div class="data-box">
          <div class="icon">🌱</div>
          <h3>Panel</h3>
          <p>Conectado</p>
        </div>

      </div>

      <div style="margin-top:25px">

        <div class="filter-title">
          <span>Filtro activo</span>
          <span id="filterNumber">0%</span>
        </div>

        <div class="bar">
          <div class="bar-fill" id="barFill"></div>
        </div>

      </div>

      <div class="complete" id="complete">
        🟢 AIRE 100% PURIFICADO
      </div>

      <button class="button" onclick="startPurification()">
        🍃 Iniciar purificación
      </button>

    </section>

  </main>

  <script>

    let progress = 0;
    let interval = null;

    const percentage = document.getElementById("percentage");
    const circle = document.getElementById("circle");
    const status = document.getElementById("status");
    const substatus = document.getElementById("substatus");
    const filtration = document.getElementById("filtration");
    const filterNumber = document.getElementById("filterNumber");
    const barFill = document.getElementById("barFill");
    const complete = document.getElementById("complete");
    const quality = document.getElementById("quality");
    const airStatus = document.getElementById("airStatus");

    function updateProgress() {

      percentage.textContent = progress + "%";
      filtration.textContent = progress + "%";
      filterNumber.textContent = progress + "%";
      barFill.style.width = progress + "%";

      const degrees = progress * 3.6;

      circle.style.background =
        `conic-gradient(#54ff9b ${degrees}deg,
        rgba(255,255,255,0.15) ${degrees}deg)`;

      if (progress < 25) {

        status.textContent = "Detectando partículas...";
        substatus.textContent = "Analizando la calidad del aire";
        quality.textContent = "Regular";

      } else if (progress < 50) {

        status.textContent = "Filtrando aire...";
        substatus.textContent = "Capturando partículas contaminantes";
        quality.textContent = "Mejorando";

      } else if (progress < 75) {

        status.textContent = "Eliminando partículas...";
        substatus.textContent = "Purificando el ambiente";
        quality.textContent = "Buena";

      } else if (progress < 100) {

        status.textContent = "Finalizando proceso...";
        substatus.textContent = "Optimizando la calidad del aire";
        quality.textContent = "Excelente";

      } else {

        status.textContent = "Purificación completa";
        substatus.textContent = "El aire está limpio y listo";
        quality.textContent = "Excelente";
        airStatus.textContent = "Purificado";

        complete.style.display = "block";
      }
    }

    function startPurification() {

      if (interval) {
        clearInterval(interval);
      }

      progress = 0;
      complete.style.display = "none";
      airStatus.textContent = "Activo";

      updateProgress();

      interval = setInterval(() => {

        progress += 1;

        updateProgress();

        if (progress >= 100) {
          clearInterval(interval);
          interval = null;
        }

      }, 60);
    }

    // Crear hojas animadas
    const leavesContainer = document.getElementById("leaves");

    for (let i = 0; i < 15; i++) {

      const leaf = document.createElement("div");

      leaf.className = "leaf";
      leaf.textContent = "🍃";

      leaf.style.left = Math.random() * 100 + "%";
      leaf.style.animationDuration = (6 + Math.random() * 8) + "s";
      leaf.style.animationDelay = (-Math.random() * 10) + "s";
      leaf.style.fontSize = (15 + Math.random() * 18) + "px";

      leavesContainer.appendChild(leaf);
    }

    updateProgress();

  </script>

</body>
</html>
